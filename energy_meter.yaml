substitutions:
  disp_name: energy_meter
  update_time: 10s
  current_cal_ct1: '62250'      # SCT-016 main L1
  current_cal_ct2: '59095'      # SCT-016 main L2
  current_cal_branch: '28646'   # SCT-013-000 branch circuits
  voltage_cal: '6921'           # 9 VAC voltage reference

esphome:
  name: energy-meter

esp32:
  variant: esp32

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  reboot_timeout: 0s

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: energy-meter

ota:
  - platform: esphome

web_server:
  port: 80

spi:
  clk_pin: 18
  miso_pin: 19
  mosi_pin: 23

sensor:
  - platform: wifi_signal
    name: ${disp_name} WiFi
    update_interval: 60s

  # ATM90E32 IC1: CT1, CT2, CT3
  - platform: atm90e32
    cs_pin: 5
    phase_a:
      voltage:
        name: ${disp_name} Volts A
        id: ic1Volts
        accuracy_decimals: 1
      current:
        name: ${disp_name} CT1 Amps
        id: ct1Amps
      power:
        name: ${disp_name} CT1 Watts
        id: ct1Watts
      power_factor:
        name: ${disp_name} CT1 Power Factor
        id: ct1PowerFactor
        accuracy_decimals: 2
      reactive_power:
        name: ${disp_name} CT1 Reactive Power
        id: ct1ReactivePower
        accuracy_decimals: 1
      apparent_power:
        name: ${disp_name} CT1 Apparent Power
        id: ct1ApparentPower
        accuracy_decimals: 1
      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal_ct1}

    phase_b:
      current:
        name: ${disp_name} CT2 Amps
        id: ct2Amps
      power:
        name: ${disp_name} CT2 Watts
        id: ct2Watts
      power_factor:
        name: ${disp_name} CT2 Power Factor
        id: ct2PowerFactor
        accuracy_decimals: 2
      reactive_power:
        name: ${disp_name} CT2 Reactive Power
        id: ct2ReactivePower
        accuracy_decimals: 1
      apparent_power:
        name: ${disp_name} CT2 Apparent Power
        id: ct2ApparentPower
        accuracy_decimals: 1
      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal_ct2}

    phase_c:
      current:
        name: ${disp_name} CT3 Amps
        id: ct3Amps
      power:
        name: ${disp_name} CT3 Watts
        id: ct3Watts
      power_factor:
        name: ${disp_name} CT3 Power Factor
        id: ct3PowerFactor
        accuracy_decimals: 2
      reactive_power:
        name: ${disp_name} CT3 Reactive Power
        id: ct3ReactivePower
        accuracy_decimals: 1
      apparent_power:
        name: ${disp_name} CT3 Apparent Power
        id: ct3ApparentPower
        accuracy_decimals: 1
      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal_branch}

    frequency:
      name: ${disp_name} Freq A
    line_frequency: 60Hz
    gain_pga: 1X
    update_interval: ${update_time}

  # ATM90E32 IC2: CT4, CT5, CT6
  - platform: atm90e32
    cs_pin: 4
    phase_a:
      current:
        name: ${disp_name} CT4 Amps
        id: ct4Amps
      power:
        name: ${disp_name} CT4 Watts
        id: ct4Watts
      power_factor:
        name: ${disp_name} CT4 Power Factor
        id: ct4PowerFactor
        accuracy_decimals: 2
      reactive_power:
        name: ${disp_name} CT4 Reactive Power
        id: ct4ReactivePower
        accuracy_decimals: 1
      apparent_power:
        name: ${disp_name} CT4 Apparent Power
        id: ct4ApparentPower
        accuracy_decimals: 1
      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal_branch}

    phase_b:
      current:
        name: ${disp_name} CT5 Amps
        id: ct5Amps
      power:
        name: ${disp_name} CT5 Watts
        id: ct5Watts
      power_factor:
        name: ${disp_name} CT5 Power Factor
        id: ct5PowerFactor
        accuracy_decimals: 2
      reactive_power:
        name: ${disp_name} CT5 Reactive Power
        id: ct5ReactivePower
        accuracy_decimals: 1
      apparent_power:
        name: ${disp_name} CT5 Apparent Power
        id: ct5ApparentPower
        accuracy_decimals: 1
      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal_branch}

    phase_c:
      current:
        name: ${disp_name} CT6 Amps
        id: ct6Amps
      power:
        name: ${disp_name} CT6 Watts
        id: ct6Watts
      power_factor:
        name: ${disp_name} CT6 Power Factor
        id: ct6PowerFactor
        accuracy_decimals: 2
      reactive_power:
        name: ${disp_name} CT6 Reactive Power
        id: ct6ReactivePower
        accuracy_decimals: 1
      apparent_power:
        name: ${disp_name} CT6 Apparent Power
        id: ct6ApparentPower
        accuracy_decimals: 1
      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal_branch}

    frequency:
      name: ${disp_name} Freq B
    line_frequency: 60Hz
    gain_pga: 1X
    update_interval: ${update_time}

  - platform: template
    name: ${disp_name} Total Amps
    id: totalAmps
    lambda: |-
      return id(ct1Amps).state
           + id(ct2Amps).state
           + id(ct3Amps).state
           + id(ct4Amps).state
           + id(ct5Amps).state
           + id(ct6Amps).state;
    accuracy_decimals: 2
    unit_of_measurement: A
    icon: "mdi:flash"
    update_interval: ${update_time}

  - platform: template
    name: ${disp_name} Total Watts
    id: totalWatts
    lambda: |-
      return id(ct1Watts).state
           + id(ct2Watts).state
           + id(ct3Watts).state
           + id(ct4Watts).state
           + id(ct5Watts).state
           + id(ct6Watts).state;
    accuracy_decimals: 1
    unit_of_measurement: W
    icon: "mdi:flash-circle"
    update_interval: ${update_time}

  - platform: total_daily_energy
    name: ${disp_name} Total kWh
    power_id: totalWatts
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh

switch:
  - platform: restart
    name: ${disp_name} Restart

time:
  - platform: sntp
    id: sntp_time
