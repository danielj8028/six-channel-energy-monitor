substitutions:
  # Display name
  disp_name: energy_meter

  # Measurement update interval
  update_time: 10s

  # SCT-013-000 current calibration
  current_cal: '28646'

  # 9 VAC voltage-reference calibration
  voltage_cal: '6921'


esphome:
  name: energy-meter


esp32:
  variant: esp32


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


# Enable logging
logger:


# Enable Home Assistant API
api:


# Enable wireless firmware updates
ota:
  - platform: esphome


# Enable the ESP32 web interface
web_server:
  port: 80


# ESP32-to-ATM90E32 SPI connection
spi:
  clk_pin: 18
  miso_pin: 19
  mosi_pin: 23


sensor:
  # Wi-Fi signal strength
  - platform: wifi_signal
    name: ${disp_name} WiFi
    update_interval: 60s


  # ============================================================
  # IC1 - CT1, CT2, CT3
  # ============================================================
  - platform: atm90e32
    cs_pin: 5

    # CT1
    phase_a:
      voltage:
        name: ${disp_name} Volts A
        id: ic1Volts
        accuracy_decimals: 1

      current:
        name: ${disp_name} CT1 Amps
        id: ct1Amps

      power:
        name: ${disp_name} CT1 Watts
        id: ct1Watts

      power_factor:
        name: ${disp_name} CT1 Power Factor
        id: ct1PowerFactor
        accuracy_decimals: 2

      reactive_power:
        name: ${disp_name} CT1 Reactive Power
        id: ct1ReactivePower
        accuracy_decimals: 1

      apparent_power:
        name: ${disp_name} CT1 Apparent Power
        id: ct1ApparentPower
        accuracy_decimals: 1

      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal}


    # CT2
    phase_b:
      current:
        name: ${disp_name} CT2 Amps
        id: ct2Amps

      power:
        name: ${disp_name} CT2 Watts
        id: ct2Watts

      power_factor:
        name: ${disp_name} CT2 Power Factor
        id: ct2PowerFactor
        accuracy_decimals: 2

      reactive_power:
        name: ${disp_name} CT2 Reactive Power
        id: ct2ReactivePower
        accuracy_decimals: 1

      apparent_power:
        name: ${disp_name} CT2 Apparent Power
        id: ct2ApparentPower
        accuracy_decimals: 1

      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal}


    # CT3
    phase_c:
      current:
        name: ${disp_name} CT3 Amps
        id: ct3Amps

      power:
        name: ${disp_name} CT3 Watts
        id: ct3Watts

      power_factor:
        name: ${disp_name} CT3 Power Factor
        id: ct3PowerFactor
        accuracy_decimals: 2

      reactive_power:
        name: ${disp_name} CT3 Reactive Power
        id: ct3ReactivePower
        accuracy_decimals: 1

      apparent_power:
        name: ${disp_name} CT3 Apparent Power
        id: ct3ApparentPower
        accuracy_decimals: 1

      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal}


    frequency:
      name: ${disp_name} Freq A

    line_frequency: 60Hz
    gain_pga: 1X
    update_interval: ${update_time}


  # ============================================================
  # IC2 — CT4, CT5, CT6
  # ============================================================
  - platform: atm90e32
    cs_pin: 4

    # CT4
    phase_a:
      current:
        name: ${disp_name} CT4 Amps
        id: ct4Amps

      power:
        name: ${disp_name} CT4 Watts
        id: ct4Watts

      power_factor:
        name: ${disp_name} CT4 Power Factor
        id: ct4PowerFactor
        accuracy_decimals: 2

      reactive_power:
        name: ${disp_name} CT4 Reactive Power
        id: ct4ReactivePower
        accuracy_decimals: 1

      apparent_power:
        name: ${disp_name} CT4 Apparent Power
        id: ct4ApparentPower
        accuracy_decimals: 1

      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal}


    # CT5
    phase_b:
      current:
        name: ${disp_name} CT5 Amps
        id: ct5Amps

      power:
        name: ${disp_name} CT5 Watts
        id: ct5Watts

      power_factor:
        name: ${disp_name} CT5 Power Factor
        id: ct5PowerFactor
        accuracy_decimals: 2

      reactive_power:
        name: ${disp_name} CT5 Reactive Power
        id: ct5ReactivePower
        accuracy_decimals: 1

      apparent_power:
        name: ${disp_name} CT5 Apparent Power
        id: ct5ApparentPower
        accuracy_decimals: 1

      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal}


    # CT6
    phase_c:
      current:
        name: ${disp_name} CT6 Amps
        id: ct6Amps

      power:
        name: ${disp_name} CT6 Watts
        id: ct6Watts

      power_factor:
        name: ${disp_name} CT6 Power Factor
        id: ct6PowerFactor
        accuracy_decimals: 2

      reactive_power:
        name: ${disp_name} CT6 Reactive Power
        id: ct6ReactivePower
        accuracy_decimals: 1

      apparent_power:
        name: ${disp_name} CT6 Apparent Power
        id: ct6ApparentPower
        accuracy_decimals: 1

      gain_voltage: ${voltage_cal}
      gain_ct: ${current_cal}


    frequency:
      name: ${disp_name} Freq B

    line_frequency: 60Hz
    gain_pga: 1X
    update_interval: ${update_time}


  # Total current
  - platform: template
    name: ${disp_name} Total Amps
    id: totalAmps
    lambda: |-
      return id(ct1Amps).state
           + id(ct2Amps).state
           + id(ct3Amps).state
           + id(ct4Amps).state
           + id(ct5Amps).state
           + id(ct6Amps).state;
    accuracy_decimals: 2
    unit_of_measurement: A
    icon: "mdi:flash"
    update_interval: ${update_time}


  # Total real power
  - platform: template
    name: ${disp_name} Total Watts
    id: totalWatts
    lambda: |-
      return id(ct1Watts).state
           + id(ct2Watts).state
           + id(ct3Watts).state
           + id(ct4Watts).state
           + id(ct5Watts).state
           + id(ct6Watts).state;
    accuracy_decimals: 1
    unit_of_measurement: W
    icon: "mdi:flash-circle"
    update_interval: ${update_time}


  # Daily energy
  - platform: total_daily_energy
    name: ${disp_name} Total kWh
    power_id: totalWatts
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh


switch:
  - platform: restart
    name: ${disp_name} Restart


time:
  - platform: sntp
    id: sntp_time